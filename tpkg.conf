# tpkg config for ImmortalWrt / OpenWrt third-party APK updates.
#
# Copy this file to /etc/config/tpkg or keep it beside the tpkg script.
# This is a small YAML subset parsed by tpkg itself. No yq/python is needed.
# arch_priority controls asset selection order when multiple APKs match.

apk_dir: /mnt/sdc1/OpenWrt/apk
download_dir: /tmp/tpkg-downloads
keep_backup: 1
arch_priority: x86_64, all, any

packages:
  - name: bandix-plus
    release: https://github.com/timsaya/openwrt-bandix-plus/releases

  - name: luci-app-bandix-plus
    release: https://github.com/timsaya/luci-app-bandix-plus/releases

  - name: luci-i18n-bandix-plus-zh-cn
    release: https://github.com/timsaya/luci-app-bandix-plus/releases

  - name: luci-theme-aurora
    release: https://github.com/eamonxg/luci-theme-aurora/releases

  - name: luci-app-aurora-config
    release: https://github.com/eamonxg/luci-app-aurora-config/releases

  - name: luci-i18n-aurora-config-zh-cn
    release: https://github.com/eamonxg/luci-app-aurora-config/releases

  - name: lucky
    release: https://github.com/sirpdboy/luci-app-lucky/releases

  - name: luci-app-lucky
    release: https://github.com/sirpdboy/luci-app-lucky/releases

  - name: luci-i18n-lucky-zh-cn
    release: https://github.com/sirpdboy/luci-app-lucky/releases

  - name: luci-app-run
    release: https://github.com/wukongdaily/luci-app-run/releases

  - name: uuplugin
    release: https://github.com/ttc0419/uuplugin/releases
