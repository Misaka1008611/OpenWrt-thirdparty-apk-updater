# tpkg config for ImmortalWrt / OpenWrt third-party APK updates.
#
# Copy this file to /etc/config/tpkg or keep it beside the tpkg script.
# Each item format:
#   package_name|github_owner/repo|asset_filename_extended_regex|expected_arch
#
# expected_arch can be:
#   x86_64  require *_x86_64.apk
#   all     require *_all.apk
#   any     only require .apk, useful for packages that do not include arch in filename

APK_DIR=${APK_DIR:-/mnt/sdc1/OpenWrt/apk}
DOWNLOAD_DIR=${DOWNLOAD_DIR:-/tmp/tpkg-downloads}
KEEP_BACKUP=${KEEP_BACKUP:-1}

TPKG_ITEMS='
bandix-plus|timsaya/openwrt-bandix-plus|^bandix-plus-.*_x86_64\.apk$|x86_64
luci-app-bandix-plus|timsaya/luci-app-bandix-plus|^luci-app-bandix-plus-.*_all\.apk$|all
luci-i18n-bandix-plus-zh-cn|timsaya/luci-app-bandix-plus|^luci-i18n-bandix-plus-zh-cn-.*_all\.apk$|all
luci-theme-aurora|eamonxg/luci-theme-aurora|^luci-theme-aurora-.*\.apk$|any
luci-app-aurora-config|eamonxg/luci-app-aurora-config|^luci-app-aurora-config-.*\.apk$|any
luci-i18n-aurora-config-zh-cn|eamonxg/luci-app-aurora-config|^luci-i18n-aurora-config-zh-cn-.*\.apk$|any
lucky|sirpdboy/luci-app-lucky|^lucky-.*\.apk$|any
luci-app-lucky|sirpdboy/luci-app-lucky|^luci-app-lucky-.*\.apk$|any
luci-i18n-lucky-zh-cn|sirpdboy/luci-app-lucky|^luci-i18n-lucky-zh-cn-.*\.apk$|any
luci-app-run|wukongdaily/luci-app-run|^luci-app-run-.*\.apk$|any
uuplugin|ttc0419/uuplugin|^uuplugin-.*_x86_64\.apk$|x86_64
'
